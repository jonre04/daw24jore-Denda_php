            <div class="carousel-container">

                <figure class="carousel-figure">

            <div class="video-section">

                </div>
                <video id="videoPlayer" controls>
                    <source src="bigbuckbunny.mp4" type="video/mp4">
                </video>
                <div class="controls-container">
                    <button class="play">PLAY</button>
                    <button class="pause">Pause</button>
                    <button class="stop">Stop</button>
                    <button class="mute">MUTE</button>
                    <button class="vol" id="volUp">VOL +</button>

                </div>
            </div>

            <hr>

            <div class="audio-section">
                <h1>🎵 Audio Kontroladorea</h1>
                <audio id="audio"></audio>
                <div class="player-container">
                    <div class="controls">
                        <button class="btn-play" onclick="playAudio()">PLAY</button>
                        <button class="btn-stop" onclick="stopAudio()">STOP</button>
                        <button class="btn-nav" onclick="prev()">anterior</button>
                        <button class="btn-nav" onclick="next()">siguiente</button>
                    </div>
                </div>
